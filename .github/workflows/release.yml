name: Release macOS

# Publish a macOS release whenever a version tag is pushed (e.g. v0.1.0).
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & release (universal macOS)
    runs-on: macos-latest
    permissions:
      # Required for tauri-action to create the GitHub Release and upload assets.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable with both macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build app and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing & notarization. Add these repository secrets
          # to ship signed builds; when they are empty the build stays unsigned
          # and users will see a Gatekeeper warning on first launch.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          # Single universal binary: runs natively on Intel and Apple Silicon.
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: 'Veil App ${{ github.ref_name }}'
          releaseBody: 'Download the .dmg below and drag Veil App into Applications.'
          releaseDraft: false
          prerelease: false
