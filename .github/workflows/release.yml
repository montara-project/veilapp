name: Release macOS

# Publish a macOS release whenever a version tag is pushed (e.g. v0.1.0).
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & release (universal macOS)
    runs-on: macos-latest
    permissions:
      # Required for tauri-action to create the GitHub Release and upload assets.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable with both macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Sign with a fixed certificate so every release keeps the same code
      # identity and macOS keeps the Accessibility grant across updates.
      # Without the secrets the build falls back to ad-hoc signing, which
      # loses the grant on every update. Imported here rather than through
      # tauri-action's APPLE_CERTIFICATE, which only accepts Apple-issued
      # certificates; scripts/create-signing-cert.sh makes a self-signed one.
      - name: Import code signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "::warning::MACOS_CERTIFICATE is not set; the app is ad-hoc signed and users must re-grant Accessibility after updating."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          rm "$RUNNER_TEMP/cert.p12"
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build app and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          # Single universal binary: runs natively on Intel and Apple Silicon.
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: "Veil App ${{ github.ref_name }}"
          releaseBody: "Download the .dmg below and drag Veil App into Applications."
          releaseDraft: false
          prerelease: false
