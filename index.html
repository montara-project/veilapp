<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veil App</title>
  </head>
  <body>
    <div id="panel">
      <header>
        <h1>Veil App</h1>
        <span id="app-count">0 apps</span>
      </header>

      <div id="update" hidden>
        <span id="update-text"></span>
        <button id="update-install">Update &amp; Restart</button>
      </div>

      <div id="access" hidden>
        <span>Allow Veil App under Accessibility to open and move menu bar icons.</span>
        <button id="access-open">Open Settings</button>
      </div>

      <main id="grid"></main>

      <p id="hint">
        Click to activate · ✕ or right-click to quit · ⌥ to force quit · eye to keep an icon visible
      </p>

      <footer>
        <div id="segmented">
          <button id="sort-name" class="active">Name</button>
          <button id="sort-memory">Memory</button>
        </div>
        <button id="hide-icons">Hide icons</button>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
